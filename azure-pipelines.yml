# Example pipeline for this repo. Sync with your Azure DevOps pipeline if the YAML
# in ADO differs from this file.

trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: Use Node.js

  - script: npm ci
    displayName: npm ci

  - script: npm run build
    displayName: Hugo build + .well-known sync

  - script: npm test
    displayName: Playwright tests
    continueOnError: true

  # Replace with your storage connection / service connection and AzCopy task.
  # Upload contents of public/ to the $web container (not the public folder itself).
  #
  # Use `sync`, not `copy`: `copy` only uploads new/changed files, so a post
  # that's removed from the build (draft: true, or moved to archived-posts/)
  # is never deleted from $web -- it stays live at its old URL forever.
  # `sync` with --delete-destination=true mirrors $web to match public/,
  # removing anything no longer produced by the build. See
  # docs/azure-static-site-deploy.md for the incident this fixes.
  #
  # - script: |
  #     azcopy sync "$(Build.SourcesDirectory)/public" \
  #       "https://duncanmackenzieblog.blob.core.windows.net/\$web?<SAS>" \
  #       --recursive --delete-destination=true
  #   displayName: Sync to static website ($web)
